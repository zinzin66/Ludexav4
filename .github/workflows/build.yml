name: Build Yop2D

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Récupérer le code
        uses: actions/checkout@v4

      - name: Configurer Java
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Installer Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.7

      - name: 1. Patch automatique de tous les Noeuds
        run: find app/src/main/java/com/ludexa/moteur -name "Noeud*.java" -type f -exec sed -i 's/InterfaceEditeur/RunnerActivity/g' {} +

      - name: 2. Compiler la coquille vide (Runner en Release)
        run: gradle assembleRunnerRelease

      - name: 2b. Signer le Runner
        uses: r0adkll/sign-android-release@v1
        id: sign_runner
        with:
          releaseDirectory: app/build/outputs/apk/runner/release
          signingKeyBase64: ${{ secrets.KEYSTORE_BASE64 }}
          alias: ${{ secrets.KEY_ALIAS }}
          keyStorePassword: ${{ secrets.KEYSTORE_PASSWORD }}
          keyPassword: ${{ secrets.KEY_PASSWORD }}

      - name: 3. Annuler le Patch (Nettoyage)
        run: git reset --hard

      - name: 4. Préparer le dossier assets
        run: mkdir -p app/src/main/assets

      - name: 5. Injecter le Runner signé
        run: cp ${{steps.sign_runner.outputs.signedReleaseFile}} app/src/main/assets/modele_runner.apk

      - name: 6. Compiler l'Éditeur Yop2D (en Release)
        run: gradle assembleEditeurRelease

      - name: 7. Signer l'Éditeur
        uses: r0adkll/sign-android-release@v1
        id: sign_editeur
        with:
          releaseDirectory: app/build/outputs/apk/editeur/release
          signingKeyBase64: ${{ secrets.KEYSTORE_BASE64 }}
          alias: ${{ secrets.KEY_ALIAS }}
          keyStorePassword: ${{ secrets.KEYSTORE_PASSWORD }}
          keyPassword: ${{ secrets.KEY_PASSWORD }}

      - name: Publier l'APK final
        uses: actions/upload-artifact@v4
        with:
          name: YOP2D-Editeur-apk
          path: ${{steps.sign_editeur.outputs.signedReleaseFile}}
          
