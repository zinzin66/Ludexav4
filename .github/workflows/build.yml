name: Build Yop2D

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Récupérer le code
        uses: actions/checkout@v4

      - name: Configurer Java
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Installer Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.7

      - name: 1. Patch automatique de tous les Noeuds
        run: find app/src/main/java/com/ludexa/moteur -name "Noeud*.java" -type f -exec sed -i 's/InterfaceEditeur/RunnerActivity/g' {} +

      - name: 2. Compiler la coquille vide (Runner)
        run: gradle assembleRunnerDebug

      - name: 3. Annuler le Patch (Nettoyage)
        run: git reset --hard

      - name: 4. Préparer le dossier assets
        run: mkdir -p app/src/main/assets

      - name: 5. Injecter le Runner
        run: cp app/build/outputs/apk/runner/debug/app-runner-debug.apk app/src/main/assets/modele_runner.apk

      - name: 6. Compiler l'Éditeur Yop2D
        run: gradle assembleEditeurDebug

      - name: Publier l'APK final
        uses: actions/upload-artifact@v4
        with:
          name: YOP2D-Editeur-apk
          path: app/build/outputs/apk/editeur/debug/app-editeur-debug.apk
          
